version: 2

models:
  - name: dim_user
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null

  - name: dim_patient
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null

  - name: dim_doctor
    columns:
      - name: doctor_id
        data_tests:
          - unique
          - not_null

  - name: dim_service
    columns:
      - name: service_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: fact_appointments
    columns:
      - name: appointment_id
        data_tests:
          - unique
          - not_null
      - name: patient_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: doctor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_doctor')
                field: doctor_id
      - name: service_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_service')
                field: service_id
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: price
        data_tests:
          - not_null
      - name: duration
        data_tests:
          - not_null
