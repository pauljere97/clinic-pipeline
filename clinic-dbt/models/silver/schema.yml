version: 2

models:
  - name: silver_users
    description: "Current-state users without the password column."
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null
          - unique

  - name: silver_patients
    description: "Current-state patients."
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_users')
                field: id

  - name: silver_doctors
    description: "Current-state doctors."
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_users')
                field: id

  - name: silver_services
    description: "Current-state clinic services."
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: duration
        data_tests:
          - not_null

  - name: silver_appointments
    description: "Current-state appointments."
    columns:
      - name: id
        data_tests:
          - unique
          - not_null
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_patients')
                field: id
      - name: doctor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_doctors')
                field: id
      - name: service_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_services')
                field: id
