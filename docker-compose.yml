x-airflow-common: &airflow-common
    build:
        context: .
        dockerfile: airflow/Dockerfile
    environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db/${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}
        AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
        AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME in .env}
        AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./postgres:/opt/airflow/postgres:ro

services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    airflow-db:
        image: postgres:16
        environment:
            POSTGRES_USER: ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
            POSTGRES_DB: ${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}
        volumes:
            - airflow-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env} -d ${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}"]
            interval: 5s
            timeout: 5s
            retries: 10

    airflow-init:
        <<: *airflow-common
        command: bash /opt/airflow/initialize.sh
        depends_on:
            airflow-db:
                condition: service_healthy

    airflow-webserver:
        <<: *airflow-common
        command: webserver
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        ports:
            - "127.0.0.1:8080:8080"
        restart: unless-stopped

    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    airflow-db-data:
