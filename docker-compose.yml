x-airflow-common: &airflow-common
    build:
        context: .
        dockerfile: airflow/Dockerfile
    environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db/${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}
        AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}
        AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME in .env}
        AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
        AWS_S3_BUCKET_ARN: ${AWS_S3_BUCKET_ARN:?Set AWS_S3_BUCKET_ARN in .env}
        AWS_REGION: ${AWS_REGION:-eu-north-1}
        SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH:?Set SNOWFLAKE_PRIVATE_KEY_PATH in .env}
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./postgres:/opt/airflow/postgres:ro
        - ./clinic-dbt:/opt/airflow/clinic-dbt
        - ./.dbt:/opt/airflow/.dbt:ro
        - type: bind
          source: ${SNOWFLAKE_PRIVATE_KEY_PATH:?Set SNOWFLAKE_PRIVATE_KEY_PATH in .env}
          target: ${SNOWFLAKE_PRIVATE_KEY_PATH:?Set SNOWFLAKE_PRIVATE_KEY_PATH in .env}
          read_only: true

services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    kafka:
        image: confluentinc/cp-kafka:7.7.1
        environment:
            CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
            interval: 10s
            timeout: 10s
            retries: 12
            start_period: 30s

    connect:
        build:
            context: .
            dockerfile: kafka/connect.Dockerfile
        environment:
            CONNECT_BOOTSTRAP_SERVERS: kafka:9092
            CONNECT_GROUP_ID: clinic-connect
            CONNECT_CONFIG_STORAGE_TOPIC: clinic-connect-configs
            CONNECT_OFFSET_STORAGE_TOPIC: clinic-connect-offsets
            CONNECT_STATUS_STORAGE_TOPIC: clinic-connect-status
            CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
            CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
            CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
            CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
            CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
            CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
            CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
            CONNECT_REST_ADVERTISED_HOST_NAME: connect
            CONNECT_REST_PORT: 8083
            CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
            CONNECT_CONFIG_PROVIDERS: env
            CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
            CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
            POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
            AWS_REGION: ${AWS_REGION:-eu-north-1}
            AWS_DEFAULT_REGION: ${AWS_REGION:-eu-north-1}
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        ports:
            - "127.0.0.1:8083:8083"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        restart: unless-stopped

    connect-init:
        image: curlimages/curl:8.10.1
        profiles: ["cdc-init"]
        environment:
            AWS_S3_BUCKET_ARN: ${AWS_S3_BUCKET_ARN:?Set AWS_S3_BUCKET_ARN in .env}
            CONNECT_URL: http://connect:8083
        volumes:
            - ./kafka/connect:/config:ro
            - ./scripts/register-connectors.sh:/scripts/register-connectors.sh:ro
        entrypoint: ["/bin/sh", "/scripts/register-connectors.sh"]
        depends_on:
            connect:
                condition: service_healthy

    airflow-db:
        image: postgres:16
        environment:
            POSTGRES_USER: ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env}
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
            POSTGRES_DB: ${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}
        volumes:
            - airflow-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER in .env} -d ${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME in .env}"]
            interval: 5s
            timeout: 5s
            retries: 10

    airflow-init:
        <<: *airflow-common
        command: bash /opt/airflow/initialize.sh
        depends_on:
            airflow-db:
                condition: service_healthy

    airflow-webserver:
        <<: *airflow-common
        command: webserver
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        ports:
            - "127.0.0.1:8080:8080"
        restart: unless-stopped

    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        restart: unless-stopped

volumes:
    airflow-db-data:
    kafka-data:
